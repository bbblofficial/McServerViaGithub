name: Paper 1.8.8 Server (FRP)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download Paper 1.8.8 Build 445
        run: |
          wget -O paper.jar https://api.papermc.io/v2/projects/paper/versions/1.8.8/builds/445/downloads/paper-1.8.8-445.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > eula.txt

      - name: Download and Configure FRP Client
        run: |
          # دانلود آخرین نسخه FRP
          wget -q https://github.com/fatedier/frp/releases/download/v0.58.1/frp_0.58.1_linux_amd64.tar.gz
          tar -xzf frp_0.58.1_linux_amd64.tar.gz
          mv frp_0.58.1_linux_amd64/frpc .
          
          # ساخت فایل کانفیگ برای وصل شدن به VPS شما
          cat <<EOF > frpc.toml
          serverAddr = "YOUR_VPS_IP_HERE"
          serverPort = 7000
          
          [[proxies]]
          name = "minecraft-server"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 25565
          remotePort = 25565
          EOF
          
          # اجرای FRP در پس‌زمینه
          ./frpc -c frpc.toml > frp.log 2>&1 &
          
          echo "========================================================="
          echo "FRP Client is running and connecting to your VPS..."
          echo "Players can join using your VPS IP: YOUR_VPS_IP_HERE:25565"
          echo "========================================================="

      - name: Start Paper Server
        run: java -Xms2G -Xmx2G -jar paper.jar nogui
