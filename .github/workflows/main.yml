name: Paper 1.8.8 (bore.pub) with Pterodactyl Panel

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Paper 1.8.8 Build 445
        run: |
          wget -O paper.jar https://fill-data.papermc.io/v1/objects/7ff6d2cec671ef0d95b3723b5c92890118fb882d73b7f8fa0a2cd31d97c55f86/paper-1.8.8-445.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > eula.txt

      - name: Install bore and create TCP tunnel
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore
          ./bore local 25565 --to bore.pub > bore.log 2>&1 &
          sleep 8
          echo "----- raw bore output -----"
          cat bore.log
          echo "---------------------------"
          sed 's/\x1b\[[0-9;]*m//g' bore.log > bore.clean.log
          echo "----- clean bore output -----"
          cat bore.clean.log
          echo "-----------------------------"
          PUBLIC_PORT=$(grep -oP 'listening at bore\.pub:\K[0-9]+' bore.clean.log | head -1)
          if [ -z "$PUBLIC_PORT" ]; then
            PUBLIC_PORT=$(grep -oP 'remote_port=\K[0-9]+' bore.clean.log | head -1)
          fi
          if [ -z "$PUBLIC_PORT" ]; then
            echo "ERROR: could not extract bore public port."
            exit 1
          fi
          echo "========================================================="
          echo "SERVER ADDRESS: bore.pub:$PUBLIC_PORT"
          echo "========================================================="
          echo "In Minecraft multiplayer, add a server with:"
          echo "  Server Address: bore.pub"
          echo "  Port:           $PUBLIC_PORT"
          echo "========================================================="

      - name: Install Dependencies (PHP, MariaDB, Nginx)
        run: |
          sudo apt update
          sudo apt install -y software-properties-common curl apt-transport-https ca-certificates
          sudo LC_ALL=C.UTF-8 add-apt-repository -y ppa:ondrej/php
          sudo apt update
          sudo apt install -y php8.1 php8.1-{cli,gd,mysql,mbstring,bcmath,xml,fpm,curl,zip} mariadb-server nginx tar unzip git redis-server

      - name: Start MariaDB and Redis
        run: |
          sudo systemctl start mariadb
          sudo systemctl start redis-server

      - name: Install Pterodactyl Panel (Automated via Expect)
        run: |
          sudo apt-get install -y expect
          cat << 'EOF' > install_panel.exp
          set timeout 1800
          spawn sudo bash -c "curl -s https://raw.githubusercontent.com/pterodactyl-installer/pterodactyl-installer/master/install.sh > install.sh && bash install.sh"
          expect {
              timeout { puts "ERROR: expect timed out waiting for Pterodactyl installer prompt"; exit 1 }
              -re {Input 0-6:}                                                   { send "0\r"; exp_continue }
              -re {Database name \(panel\):}                                     { send "\r"; exp_continue }
              -re {Database username \(pterodactyl\):}                           { send "\r"; exp_continue }
              -re {Password \(press enter to use randomly generated password\):} { send "\r"; exp_continue }
              -re {Select timezone \[.*\]:}                                      { send "UTC\r"; exp_continue }
              -re {email address that will be used to configure}                 { send "admin@example.com\r"; exp_continue }
              -re {Email address for the initial admin account:}                 { send "admin@example.com\r"; exp_continue }
              -re {Username for the initial admin account:}                      { send "admin\r"; exp_continue }
              -re {First name for the initial admin account:}                    { send "Admin\r"; exp_continue }
              -re {Last name for the initial admin account:}                     { send "User\r"; exp_continue }
              -re {Password for the initial admin account:}                      { send "AdminPassword123!\r"; exp_continue }
              -re {Set the FQDN of this panel}                                   { send "127.0.0.1\r"; exp_continue }
              -re {configure UFW.*\(y/N\)}                                       { send "N\r"; exp_continue }
              -re {configure HTTPS using Let's Encrypt.*\(y/N\)}                 { send "N\r"; exp_continue }
              -re {[Tt]elemetry[^:]*\(y/N\)}                                     { send "N\r"; exp_continue }
              -re {[Tt]elemetry.*\?.*}                                           { send "N\r"; exp_continue }
              -re {Continue with installation.*\(y/N\)}                          { send "y\r"; exp_continue }
              eof
          }
          EOF
          expect install_panel.exp

      - name: Start Cloudflare Quick Tunnel for Pterodactyl Panel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://localhost:80 > cloudflared.log 2>&1 &
          sleep 10
          echo "----- Cloudflare Tunnel Output -----"
          cat cloudflared.log
          echo "------------------------------------"
          PANEL_URL=$(grep -oP 'https://\K[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
          if [ -z "$PANEL_URL" ]; then
            echo "ERROR: Could not extract cloudflared URL."
            exit 1
          fi

          # Inject the new Cloudflare Tunnel URL into Laravel's APP_URL configuration
          sudo sed -i "s|APP_URL=http://127.0.0.1|APP_URL=https://$PANEL_URL|g" /var/www/pterodactyl/.env
          cd /var/www/pterodactyl && sudo -u www-data php artisan optimize:clear

          echo "========================================================="
          echo "PTERODACTYL PANEL URL: https://$PANEL_URL"
          echo "ADMIN EMAIL: admin@example.com"
          echo "ADMIN PASSWORD: AdminPassword123!"
          echo "========================================================="
          echo "Use this URL and credentials to access your Pterodactyl Panel."

      - name: Start Paper Server
        run: java -Xms2G -Xmx2G -jar paper.jar nogui
