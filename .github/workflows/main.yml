name: Paper 1.8.8 + EssentialsX + optional Pterodactyl (multi tunnel)

on:
  workflow_dispatch:
    inputs:
      with_panel:
        description: "Run through Pterodactyl panel (heavy, ~10 min setup, bore only)"
        type: boolean
        default: false
      online_mode:
        description: "online-mode (true = premium only, false = cracked allowed)"
        type: boolean
        default: true
      install_essentials:
        description: "Automatically install EssentialsX"
        type: boolean
        default: true
      op_player:
        description: "Player to OP automatically (empty = nobody)"
        type: string
        default: "muvixo"
      tunnel:
        description: "auto = bore > pinggy > serveo > playit (retried 3x) | or force one. Panel needs bore or auto. playit needs a repo secret (see comments)."
        type: choice
        options: [auto, bore, pinggy, serveo, playit]
        default: auto
      bore_server:
        description: "bore server (bore.pub is the public one; you can self-host your own `bore server`)"
        type: string
        default: "bore.pub"
      mc_port:
        description: "Preferred public port (bore only; others pick their own and print it in the log)"
        type: string
        default: "47310"
      panel_port:
        description: "Public port for the panel (only with_panel)"
        type: string
        default: "8000"
      wings_port:
        description: "Public port for Wings (only with_panel)"
        type: string
        default: "8080"

concurrency:
  group: minecraft-server
  cancel-in-progress: true

env:
  REQ_MC_PORT: ${{ inputs.mc_port }}
  REQ_PANEL_PORT: ${{ inputs.panel_port }}
  REQ_WINGS_PORT: ${{ inputs.wings_port }}
  OP_PLAYER: ${{ inputs.op_player }}
  BORE_HOST: ${{ inputs.bore_server }}
  # Optional repository secrets (Settings > Secrets and variables > Actions):
  #   PLAYIT_SECRET  -> playit.gg agent secret
  PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}

jobs:
  run-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    # ------------------------------------------------------------
    # 0. prepare
    # ------------------------------------------------------------
    - name: Prepare
      run: |
        set -e
        PW="$(openssl rand -hex 8)Aa1"
        echo "PANEL_PASS=$PW" >> "$GITHUB_ENV"
        if [ "${{ inputs.with_panel }}" = "true" ] && [ "${{ inputs.tunnel }}" != "bore" ] && [ "${{ inputs.tunnel }}" != "auto" ]; then
          echo "::error::with_panel only works with tunnel=bore or tunnel=auto."; exit 1
        fi
        if ! [[ "$OP_PLAYER" =~ ^[A-Za-z0-9_]{0,16}$ ]]; then
          echo "::error::op_player must be a valid Minecraft name (letters, digits, underscore, max 16)."; exit 1
        fi
        if ! [[ "$BORE_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
          echo "::error::bore_server must be a plain hostname."; exit 1
        fi

        sudo ufw disable 2>/dev/null || true
        sudo iptables -P INPUT ACCEPT 2>/dev/null || true
        sudo iptables -P FORWARD ACCEPT 2>/dev/null || true
        sudo iptables -P OUTPUT ACCEPT 2>/dev/null || true
        sudo iptables -F 2>/dev/null || true
        echo "Firewall opened."

    # ------------------------------------------------------------
    # 1. public TCP tunnel (bore / pinggy / serveo / playit / auto)
    # ------------------------------------------------------------
    - name: Start tunnel
      run: |
        set -e
        MODE="${{ inputs.tunnel }}"
        PANEL="${{ inputs.with_panel }}"
        ADDR=""

        mkdir -p ~/.ssh
        [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q

        # ---------- supervisor scripts (auto-reconnect) ----------
        cat > bore_sup.sh << 'EOF'
        #!/bin/bash
        # usage: bore_sup.sh LOCAL_PORT REMOTE_PORT BORE_BIN HOST
        while true; do
          "$3" local "$1" --to "$4" --port "$2" >> "/tmp/bore_$2.log" 2>&1
          echo "$(date -u) bore $2 exited, restarting" >> "/tmp/bore_$2.log"
          sleep 3
        done
        EOF

        cat > pinggy_sup.sh << 'EOF'
        #!/bin/bash
        # free pinggy tunnels time out after ~60 min: reconnect (address may change)
        while true; do
          tail -f /dev/null | ssh -T -p 443 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=15 \
            -R0:localhost:25565 tcp@a.pinggy.io >> /tmp/pinggy.log 2>&1
          echo "$(date -u) pinggy exited, restarting in 20s" >> /tmp/pinggy.log
          sleep 20
        done
        EOF

        cat > serveo_sup.sh << 'EOF'
        #!/bin/bash
        while true; do
          tail -f /dev/null | ssh -T \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=15 \
            -R 0:localhost:25565 serveo.net >> /tmp/serveo.log 2>&1
          echo "$(date -u) serveo exited, restarting in 10s" >> /tmp/serveo.log
          sleep 10
        done
        EOF

        cat > generic_sup.sh << 'EOF'
        #!/bin/bash
        # usage: generic_sup.sh LOGFILE CMD...
        LOG="$1"; shift
        while true; do
          "$@" >> "$LOG" 2>&1
          echo "$(date -u) $1 exited, restarting in 5s" >> "$LOG"
          sleep 5
        done
        EOF
        chmod +x bore_sup.sh pinggy_sup.sh serveo_sup.sh generic_sup.sh

        strip() { sed 's/\x1b\[[0-9;]*m//g' "$1"; }

        # open_port NAME LOCAL|same PREFERRED_PORT -> prints the port actually obtained
        open_port() {
          local name=$1 loc=$2 port=$3 L i t
          for t in 1 2 3 4 5 6 7 8; do
            L=$loc; [ "$loc" = "same" ] && L=$port
            : > "/tmp/bore_$port.log"
            nohup ./bore_sup.sh "$L" "$port" "$PWD/bore" "$BORE_HOST" > /dev/null 2>&1 &
            for i in $(seq 1 10); do
              if strip "/tmp/bore_$port.log" | grep -q "$BORE_HOST:$port"; then
                echo "$name -> $BORE_HOST:$port" >&2
                echo "$port"; return 0
              fi
              grep -q "port already in use" "/tmp/bore_$port.log" && break
              sleep 1
            done
            echo "$name: port $port not available, trying another" >&2
            pkill -f "bore_sup.sh $L $port " 2>/dev/null || true
            pkill -f "local $L --to $BORE_HOST --port $port" 2>/dev/null || true
            port=$((RANDOM % 40000 + 20000))
          done
          return 1
        }

        # ---------- bore ----------
        try_bore() {
          local VER MC PP WP ok=""
          if [ ! -x ./bore ]; then
            VER=$(curl -fsSL https://api.github.com/repos/ekzhang/bore/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' || true)
            for v in $VER v0.6.0 v0.5.2 v0.5.1; do
              if curl -fsSL "https://github.com/ekzhang/bore/releases/download/${v}/bore-${v}-x86_64-unknown-linux-musl.tar.gz" | tar xz 2>/dev/null; then
                ok=1; break
              fi
            done
            [ -n "$ok" ] && [ -f bore ] || { echo "bore: download failed"; return 1; }
            chmod +x bore
          fi
          MC=$(open_port minecraft 25565 "$REQ_MC_PORT") || { echo "bore: no free port on $BORE_HOST (down?)"; tail -n 20 /tmp/bore_*.log 2>/dev/null || true; return 1; }
          echo "TUNNEL_HOST=$BORE_HOST" >> "$GITHUB_ENV"
          echo "MC_PORT=$MC" >> "$GITHUB_ENV"
          ADDR="$BORE_HOST:$MC"
          if [ "$PANEL" = "true" ]; then
            PP=$(open_port panel 80 "$REQ_PANEL_PORT") || { echo "bore: no panel port"; return 1; }
            WP=$(open_port wings same "$REQ_WINGS_PORT") || { echo "bore: no wings port"; return 1; }
            echo "PANEL_PORT=$PP" >> "$GITHUB_ENV"
            echo "WINGS_PORT=$WP" >> "$GITHUB_ENV"
          fi
          return 0
        }

        # ---------- pinggy ----------
        try_pinggy() {
          local i
          : > /tmp/pinggy.log
          nohup ./pinggy_sup.sh > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            ADDR=$(strip /tmp/pinggy.log | grep -oE 'tcp://[A-Za-z0-9.-]+:[0-9]{2,5}' | head -1 | sed 's#tcp://##' || true)
            [ -n "$ADDR" ] && return 0
            grep -qE 'timed out|refused|Permission denied|forwarding failed' /tmp/pinggy.log && break
            sleep 1
          done
          echo "pinggy: no address. Log:"; cat /tmp/pinggy.log || true
          pkill -f pinggy_sup.sh 2>/dev/null || true
          pkill -f "pinggy.io" 2>/dev/null || true
          return 1
        }

        # ---------- serveo (ssh -R, open source server) ----------
        try_serveo() {
          local i
          : > /tmp/serveo.log
          nohup ./serveo_sup.sh > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            ADDR=$(strip /tmp/serveo.log | grep -oE 'serveo\.net:[0-9]{2,5}' | head -1 || true)
            [ -n "$ADDR" ] && return 0
            grep -qE 'timed out|refused|Permission denied|forwarding failed' /tmp/serveo.log && break
            sleep 1
          done
          echo "serveo: no address. Log:"; cat /tmp/serveo.log || true
          pkill -f serveo_sup.sh 2>/dev/null || true
          pkill -f "serveo.net" 2>/dev/null || true
          return 1
        }

        # ---------- playit.gg (open source agent, needs PLAYIT_SECRET + a tunnel set to 25565 in the dashboard) ----------
        try_playit() {
          local i
          if [ -z "$PLAYIT_SECRET" ]; then echo "playit: secret PLAYIT_SECRET not set, skipping"; return 1; fi
          echo "::add-mask::$PLAYIT_SECRET"
          if [ ! -x ./playit ]; then
            curl -fsSL -o playit "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64" || return 1
            chmod +x playit
          fi
          : > /tmp/playit.log
          nohup ./generic_sup.sh /tmp/playit.log ./playit -s --secret "$PLAYIT_SECRET" > /dev/null 2>&1 &
          for i in $(seq 1 40); do
            ADDR=$(strip /tmp/playit.log | grep -oE '[A-Za-z0-9.-]+\.(joinmc\.link|gl\.joinmc\.link|ply\.gg)(:[0-9]{2,5})?' | head -1 || true)
            [ -n "$ADDR" ] && return 0
            sleep 1
          done
          if pgrep -f "playit -s" > /dev/null; then
            ADDR="(agent running - copy the address from your playit.gg dashboard)"
            return 0
          fi
          echo "playit: failed. Log:"; cat /tmp/playit.log || true
          return 1
        }

        # ---------- one pass over the selected tunnel(s) ----------
        run_once() {
          case "$MODE" in
            bore)   try_bore ;;
            pinggy) try_pinggy ;;
            serveo) try_serveo ;;
            playit) try_playit ;;
            auto)
              try_bore   && return 0; echo ">> bore failed, trying pinggy"
              try_pinggy && return 0; echo ">> pinggy failed, trying serveo"
              try_serveo && return 0; echo ">> serveo failed, trying playit"
              try_playit && return 0
              return 1 ;;
          esac
        }

        # ---------- run, retrying up to 3 rounds ----------
        OK=""
        for round in 1 2 3; do
          if [ "$PANEL" = "true" ]; then try_bore && { OK=1; break; }
          else run_once && { OK=1; break; }
          fi
          echo ">> round $round failed, waiting 20s"; sleep 20
        done

        [ -n "$OK" ] || { echo "::error::no tunnel could be opened after 3 rounds"; exit 1; }
        echo "PUBLIC_ADDR=$ADDR" >> "$GITHUB_ENV"
        echo "Tunnel OK -> $ADDR"

    # ------------------------------------------------------------
    # 2. Paper jar + EssentialsX
    # ------------------------------------------------------------
    - name: Download Paper 1.8.8 build 445
      run: |
        set -e
        URLS=(
          "https://api.papermc.io/v2/projects/paper/versions/1.8.8/builds/445/downloads/paper-1.8.8-445.jar"
          "https://fill-data.papermc.io/v1/objects/7ff6d2cec671ef0d95b3723b5c92890118fb882d73b7f8fa0a2cd31d97c55f86/paper-1.8.8-445.jar"
        )
        rm -f paper.jar
        for u in "${URLS[@]}"; do
          echo "Trying $u"
          if curl -fsSL --retry 3 -o paper.jar "$u" && unzip -tq paper.jar > /dev/null 2>&1; then
            echo "OK"; break
          fi
          rm -f paper.jar
        done
        [ -s paper.jar ] || { echo "::error::could not download a valid paper.jar"; exit 1; }
        ls -lh paper.jar

    - name: Download EssentialsX
      if: ${{ inputs.install_essentials }}
      run: |
        # newest EssentialsX that still supports 1.8.8 first, older ones as fallback
        rm -f essentials.jar
        for v in 2.20.1 2.19.7 2.18.2; do
          for u in \
            "https://github.com/EssentialsX/Essentials/releases/download/${v}/EssentialsX-${v}.jar" \
            "https://repo.essentialsx.net/releases/net/essentialsx/EssentialsX/${v}/EssentialsX-${v}.jar"; do
            echo "Trying $u"
            if curl -fsSL --retry 3 -o essentials.jar "$u" && unzip -tq essentials.jar > /dev/null 2>&1; then
              echo "EssentialsX $v downloaded"; break 2
            fi
            rm -f essentials.jar
          done
        done
        if [ -s essentials.jar ]; then
          ls -lh essentials.jar
        else
          echo "::warning::could not download EssentialsX, server will start without it"
        fi

    # ------------------------------------------------------------
    # 3A. standalone mode
    # ------------------------------------------------------------
    - name: Setup Java 8
      if: ${{ !inputs.with_panel }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "8"

    - name: Start standalone Paper
      if: ${{ !inputs.with_panel }}
      run: |
        set -e
        mkdir -p mc/plugins && cp paper.jar mc/paper.jar
        [ -s essentials.jar ] && cp essentials.jar mc/plugins/EssentialsX.jar || true
        # console input pipe, so we can send commands (op ...) to the server
        rm -f mc.in; mkfifo mc.in
        nohup sleep infinity <> mc.in > /dev/null 2>&1 &
        cd mc
        echo "eula=true" > eula.txt
        echo "online-mode=${{ inputs.online_mode }}" > server.properties
        echo "server-port=25565" >> server.properties
        nohup java -Xms1G -XX:+UseG1GC -jar paper.jar nogui < ../mc.in > ../server.log 2>&1 &
        echo $! > ../paper.pid
        for i in $(seq 1 180); do
          grep -q 'Done (' ../server.log && break
          kill -0 "$(cat ../paper.pid)" 2>/dev/null || { echo "::error::Paper died"; tail -n 50 ../server.log; exit 1; }
          sleep 2
        done
        grep -q 'Done (' ../server.log || { echo "::error::Paper did not finish starting"; tail -n 50 ../server.log; exit 1; }
        echo "Paper is up."
        if grep -qi 'Essentials.*enabled\|Enabling Essentials' ../server.log; then echo "EssentialsX loaded."; elif [ -s ../essentials.jar ]; then echo "::warning::EssentialsX not detected in log"; grep -i essentials ../server.log || true; fi

        if [ -n "$OP_PLAYER" ]; then
          echo "op $OP_PLAYER" > ../mc.in
          sleep 5
          echo "--- server answer to 'op $OP_PLAYER' ---"
          tail -n 5 ../server.log
        fi

    # ------------------------------------------------------------
    # 3B. Pterodactyl mode
    # ------------------------------------------------------------
    - name: Install dependencies
      if: ${{ inputs.with_panel }}
      run: |
        set -e
        sudo systemctl stop apache2 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y software-properties-common curl ca-certificates
        sudo LC_ALL=C.UTF-8 add-apt-repository -y ppa:ondrej/php
        sudo apt-get update
        sudo apt-get install -y php8.1 php8.1-{cli,gd,mysql,mbstring,bcmath,xml,fpm,curl,zip} \
          mariadb-server nginx tar unzip git redis-server jq expect python3-yaml
        sudo systemctl enable --now mariadb redis-server

    - name: Install Pterodactyl panel
      if: ${{ inputs.with_panel }}
      run: |
        set -e
        cat << 'EOF' > install_panel.exp
        set timeout 1800
        spawn sudo bash -c "curl -fsSL https://raw.githubusercontent.com/pterodactyl-installer/pterodactyl-installer/master/install.sh -o /tmp/install.sh && bash /tmp/install.sh"
        expect {
            timeout { puts "TIMEOUT"; exit 1 }
            -re {Continue with installation\? \(y/N\):}                         { send "y\r"; exp_continue }
            -re {Input 0-6:}                                                    { send "0\r"; exp_continue }
            -re {Database name \(panel\):}                                      { send "\r";  exp_continue }
            -re {Database username \(pterodactyl\):}                            { send "\r";  exp_continue }
            -re {Password \(press enter to use randomly generated password\):}  { send "\r";  exp_continue }
            -re {Select timezone \[[^\]]*\]:}                                   { send "UTC\r"; exp_continue }
            -re {Provide the email address that will be used to configure}      { send "admin@example.com\r"; exp_continue }
            -re {Email address for the initial admin account:}                  { send "admin@example.com\r"; exp_continue }
            -re {Username for the initial admin account:}                       { send "admin\r"; exp_continue }
            -re {First name for the initial admin account:}                     { send "Admin\r"; exp_continue }
            -re {Last name for the initial admin account:}                      { send "User\r";  exp_continue }
            -re {Password for the initial admin account:}                       { send "$env(PANEL_PASS)\r"; exp_continue }
            -re {Set the FQDN of this panel}                                    { send "127.0.0.1\r"; exp_continue }
            -re {(?i)Let'?s Encrypt[^\n]*\(y/N\):}                              { send "n\r"; exp_continue }
            -re {(?i)automatically configure[^\n]*HTTPS[^\n]*\(y/N\):}         { send "n\r"; exp_continue }
            -re {configure UFW \(firewall\)\? \(y/N\):}                         { send "N\r"; exp_continue }
            -re {anonymous telemetry data\? \(yes/no\) \[yes\]:}                { send "no\r"; exp_continue }
            eof
        }
        EOF
        expect install_panel.exp
        test -f /var/www/pterodactyl/.env || { echo "::error::panel install failed"; exit 1; }

        # accept any Host header, set public URL (through the tunnel)
        sudo rm -f /etc/nginx/sites-enabled/default || true
        for f in /etc/nginx/sites-available/pterodactyl.conf /etc/nginx/sites-available/pterodactyl; do
          [ -f "$f" ] && sudo sed -i -E 's/^([[:space:]]*server_name[[:space:]]+).*;/\1_;/' "$f"
        done
        sudo nginx -t && sudo systemctl reload nginx

        ENV=/var/www/pterodactyl/.env
        setenv() { grep -q "^$1=" $ENV && sudo sed -i "s|^$1=.*|$1=$2|" $ENV || echo "$1=$2" | sudo tee -a $ENV > /dev/null; }
        setenv APP_URL "http://${TUNNEL_HOST}:${PANEL_PORT}"
        setenv TRUSTED_PROXIES "*"
        setenv SESSION_SECURE_COOKIE "false"
        cd /var/www/pterodactyl && sudo -u www-data php artisan optimize:clear
        echo "Panel OK"

    - name: Install Wings
      if: ${{ inputs.with_panel }}
      run: |
        set -e
        sudo systemctl enable --now docker
        sudo mkdir -p /etc/pterodactyl /var/lib/pterodactyl/volumes
        sudo curl -fL -o /usr/local/bin/wings "https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_amd64"
        sudo chmod 755 /usr/local/bin/wings

    - name: Create API keys
      if: ${{ inputs.with_panel }}
      run: |
        set -e
        sudo tee /tmp/mk-apikey.php > /dev/null << 'PHP'
        <?php
        try {
            require '/var/www/pterodactyl/vendor/autoload.php';
            $app = require '/var/www/pterodactyl/bootstrap/app.php';
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $cls = '\\Pterodactyl\\Models\\ApiKey';
            $cls::where('memo', 'automation')->delete();
            $casts = (new $cls)->getCasts();
            $encrypted = isset($casts['token']) && $casts['token'] === 'encrypted';
            $make = function (int $type, string $prefix, array $extra) use ($cls, $encrypted) {
                $plain = bin2hex(random_bytes(16));
                $identifier = $prefix . substr(bin2hex(random_bytes(8)), 0, 11);
                $key = new $cls;
                $key->forceFill(array_merge([
                    'user_id' => 1, 'key_type' => $type, 'identifier' => $identifier,
                    'token' => $encrypted ? $plain : \Illuminate\Support\Facades\Crypt::encrypt($plain),
                    'memo' => 'automation', 'allowed_ips' => [],
                ], $extra));
                $key->save();
                return $identifier . $plain;
            };
            $rw = 3;
            echo $make($cls::TYPE_APPLICATION, 'ptla_', [
                'r_servers'=>$rw,'r_nodes'=>$rw,'r_allocations'=>$rw,'r_users'=>$rw,'r_locations'=>$rw,
                'r_nests'=>$rw,'r_eggs'=>$rw,'r_database_hosts'=>$rw,'r_server_databases'=>$rw,
            ]) . "\n" . $make($cls::TYPE_ACCOUNT, 'ptlc_', []) . "\n";
        } catch (Throwable $e) {
            fwrite(STDERR, get_class($e) . ': ' . $e->getMessage() . "\n");
            exit(1);
        }
        PHP
        cd /var/www/pterodactyl
        sudo -u www-data php -d display_errors=stderr /tmp/mk-apikey.php > /tmp/mk-apikey.out || { cat /tmp/mk-apikey.out; exit 1; }
        API_KEY=$(sed -n 1p /tmp/mk-apikey.out); CLIENT_KEY=$(sed -n 2p /tmp/mk-apikey.out)
        sudo rm -f /tmp/mk-apikey.php /tmp/mk-apikey.out
        [ -n "$API_KEY" ] && [ -n "$CLIENT_KEY" ] || { echo "::error::empty API keys"; exit 1; }
        echo "::add-mask::$API_KEY"; echo "::add-mask::$CLIENT_KEY"
        echo "API_KEY=$API_KEY" >> "$GITHUB_ENV"
        echo "CLIENT_KEY=$CLIENT_KEY" >> "$GITHUB_ENV"
        CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/api/application/locations \
          -H "Authorization: Bearer $API_KEY" -H "Accept: application/json")
        [ "$CODE" = "200" ] || { echo "::error::API check failed (HTTP $CODE)"; exit 1; }

    - name: Create node, start Wings
      if: ${{ inputs.with_panel }}
      run: |
        set -e
        H=(-H "Authorization: Bearer $API_KEY" -H "Accept: application/json" -H "Content-Type: application/json")

        LOC_ID=$(curl -s -X POST http://127.0.0.1/api/application/locations "${H[@]}" \
          -d '{"short":"local","long":"Local"}' | jq -r '.attributes.id')
        [ "$LOC_ID" != "null" ] || { echo "::error::location failed"; exit 1; }

        # server memory limit is 0 (unlimited), node just gets the runner's RAM
        NODE_MEM=7000
        NODE_ID=$(curl -s -X POST http://127.0.0.1/api/application/nodes "${H[@]}" -d "{
          \"name\":\"Local Node\",\"location_id\":$LOC_ID,\"fqdn\":\"$TUNNEL_HOST\",\"scheme\":\"http\",
          \"behind_proxy\":false,\"memory\":$NODE_MEM,\"memory_overallocate\":100,\"disk\":20480,
          \"disk_overallocate\":0,\"upload_size\":100,\"daemon_sftp\":2022,\"daemon_listen\":$WINGS_PORT}" \
          | jq -r '.attributes.id')
        [ "$NODE_ID" != "null" ] || { echo "::error::node failed"; exit 1; }
        echo "NODE_ID=$NODE_ID" >> "$GITHUB_ENV"

        curl -s "http://127.0.0.1/api/application/nodes/$NODE_ID/configuration" "${H[@]}" > /tmp/wings.raw
        sudo -E python3 - << 'PY'
        import yaml, json
        raw = open('/tmp/wings.raw').read()
        try: d = json.loads(raw)
        except Exception: d = yaml.safe_load(raw)
        d['api']['host'] = '0.0.0.0'
        d['api']['port'] = int(__import__('os').environ['WINGS_PORT'])
        d['remote'] = 'http://127.0.0.1'
        d['allowed_origins'] = ['*']
        open('/etc/pterodactyl/config.yml', 'w').write(yaml.safe_dump(d))
        PY
        sudo chmod 600 /etc/pterodactyl/config.yml
        sudo nohup /usr/local/bin/wings --config /etc/pterodactyl/config.yml > /tmp/wings.log 2>&1 &
        CODE=""
        for i in $(seq 1 30); do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:${WINGS_PORT}/api/system || true)
          if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then break; fi
          sleep 2
        done
        [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || { echo "::error::Wings did not start"; tail -n 60 /tmp/wings.log; exit 1; }
        echo "Wings up."

        # The node address is the public tunnel host (browsers need it). The panel runs on this
        # same machine, so send its own requests to that address straight back to localhost
        # instead of looping through the tunnel (that loop gave DaemonConnectionException 504).
        BIP=$(getent ahostsv4 "$TUNNEL_HOST" | awk '{print $1; exit}')
        if [ -n "$BIP" ]; then
          sudo iptables -t nat -A OUTPUT -d "$BIP" -p tcp --dport "$WINGS_PORT" -j REDIRECT
          sudo iptables -t nat -A OUTPUT -d "$BIP" -p tcp --dport "$PANEL_PORT" -j REDIRECT --to-ports 80
          echo "Local redirect for $TUNNEL_HOST ($BIP) ports $WINGS_PORT/$PANEL_PORT enabled."
        fi
        CODE=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "http://${TUNNEL_HOST}:${WINGS_PORT}/api/system" || true)
        if [ "$CODE" != "200" ] && [ "$CODE" != "401" ]; then
          echo "::error::panel cannot reach Wings at ${TUNNEL_HOST}:${WINGS_PORT} (HTTP $CODE)"
          tail -n 60 /tmp/wings.log; exit 1
        fi
        echo "Panel -> Wings connection OK."

    - name: Create and start Minecraft server in Pterodactyl
      if: ${{ inputs.with_panel }}
      run: |
        set -e
        H=(-H "Authorization: Bearer $API_KEY" -H "Accept: application/json" -H "Content-Type: application/json")

        curl -s -X POST "http://127.0.0.1/api/application/nodes/$NODE_ID/allocations" "${H[@]}" \
          -d '{"ip":"0.0.0.0","ports":["25565"]}' > /dev/null
        ALLOC_ID=$(curl -s "http://127.0.0.1/api/application/nodes/$NODE_ID/allocations" "${H[@]}" \
          | jq -r '.data[] | select(.attributes.port==25565) | .attributes.id' | head -1)
        [ -n "$ALLOC_ID" ] && [ "$ALLOC_ID" != "null" ] || { echo "::error::no allocation"; exit 1; }

        EGG_ID=$(curl -s "http://127.0.0.1/api/application/nests/1/eggs" "${H[@]}" \
          | jq -r '.data[] | select(.attributes.name=="Paper") | .attributes.id' | head -1)
        [ -n "$EGG_ID" ] && [ "$EGG_ID" != "null" ] || { echo "::error::Paper egg not found"; exit 1; }

        PAYLOAD="{
          \"name\":\"Paper 1.8.8\",\"user\":1,\"node\":$NODE_ID,\"nest\":1,\"egg\":$EGG_ID,
          \"docker_image\":\"ghcr.io/parkervcp/yolks:java_8\",
          \"startup\":\"java -Xms1G -XX:+UseG1GC -jar {{SERVER_JARFILE}}\",
          \"environment\":{\"SERVER_JARFILE\":\"server.jar\",\"MINECRAFT_VERSION\":\"1.8.8\",\"MC_VERSION\":\"1.8.8\",\"BUILD_NUMBER\":\"445\",\"DL_PATH\":\"\"},
          \"limits\":{\"memory\":0,\"swap\":0,\"disk\":10240,\"io\":500,\"cpu\":200},
          \"feature_limits\":{\"databases\":0,\"backups\":0,\"allocations\":1},
          \"allocation\":{\"default\":$ALLOC_ID},\"skip_scripts\":true,\"start_on_completion\":false}"
        SRV=""; SRV_UUID=""
        for try in 1 2 3 4 5; do
          SRV=$(curl -s -m 120 -X POST http://127.0.0.1/api/application/servers "${H[@]}" -d "$PAYLOAD")
          SRV_UUID=$(echo "$SRV" | jq -r '.attributes.uuid' 2>/dev/null || true)
          [ -n "$SRV_UUID" ] && [ "$SRV_UUID" != "null" ] && break
          echo "server creation attempt $try failed, retrying in 10s:"; echo "$SRV" | jq -c . 2>/dev/null || echo "$SRV"
          sleep 10
        done
        SRV_IDENT=$(echo "$SRV" | jq -r '.attributes.identifier')
        [ "$SRV_UUID" != "null" ] && [ -n "$SRV_UUID" ] || { echo "::error::server creation failed"; echo "$SRV" | jq .; exit 1; }
        echo "SRV_IDENT=$SRV_IDENT" >> "$GITHUB_ENV"

        DIR="/var/lib/pterodactyl/volumes/$SRV_UUID"
        for i in $(seq 1 60); do [ -d "$DIR" ] && break; sleep 2; done
        [ -d "$DIR" ] || { echo "::error::server dir missing"; tail -n 60 /tmp/wings.log; exit 1; }
        sudo cp paper.jar "$DIR/server.jar"
        echo "eula=true" | sudo tee "$DIR/eula.txt" > /dev/null
        echo "online-mode=${{ inputs.online_mode }}" | sudo tee "$DIR/server.properties" > /dev/null
        FILES=("$DIR/server.jar" "$DIR/eula.txt" "$DIR/server.properties")
        if [ -s essentials.jar ]; then
          sudo mkdir -p "$DIR/plugins"
          sudo cp essentials.jar "$DIR/plugins/EssentialsX.jar"
          FILES+=("$DIR/plugins" "$DIR/plugins/EssentialsX.jar")
        fi
        sudo chown -R --reference="$DIR" "${FILES[@]}" 2>/dev/null || true

        CODE=""
        for i in $(seq 1 20); do
          CODE=$(curl -s -o /tmp/power.json -w "%{http_code}" -X POST \
            "http://127.0.0.1/api/client/servers/$SRV_IDENT/power" \
            -H "Authorization: Bearer $CLIENT_KEY" -H "Accept: application/json" \
            -H "Content-Type: application/json" -d '{"signal":"start"}' || true)
          [ "$CODE" = "204" ] && break
          sleep 5
        done
        [ "$CODE" = "204" ] || { echo "::error::start failed (HTTP $CODE)"; cat /tmp/power.json; exit 1; }
        echo "Pterodactyl server started."

    - name: Give OP (panel mode)
      if: ${{ inputs.with_panel }}
      run: |
        set -e
        [ -n "$OP_PLAYER" ] || { echo "op_player empty, skipping"; exit 0; }
        STATE=""
        for i in $(seq 1 60); do
          STATE=$(curl -s "http://127.0.0.1/api/client/servers/$SRV_IDENT/resources" \
            -H "Authorization: Bearer $CLIENT_KEY" -H "Accept: application/json" | jq -r '.attributes.current_state' 2>/dev/null || true)
          [ "$STATE" = "running" ] && break
          sleep 5
        done
        [ "$STATE" = "running" ] || { echo "::warning::server not running yet, could not OP $OP_PLAYER"; exit 0; }
        sleep 60   # let Paper + plugins finish loading
        CODE=""
        for i in $(seq 1 10); do
          CODE=$(curl -s -o /tmp/cmd.json -w "%{http_code}" -X POST \
            "http://127.0.0.1/api/client/servers/$SRV_IDENT/command" \
            -H "Authorization: Bearer $CLIENT_KEY" -H "Accept: application/json" \
            -H "Content-Type: application/json" -d "{\"command\":\"op $OP_PLAYER\"}" || true)
          [ "$CODE" = "204" ] && break
          sleep 10
        done
        if [ "$CODE" = "204" ]; then echo "Sent: op $OP_PLAYER"; else echo "::warning::could not send op command (HTTP $CODE)"; cat /tmp/cmd.json || true; fi

    # ------------------------------------------------------------
    # 4. info + watchdog
    # ------------------------------------------------------------
    - name: Show connection info
      run: |
        echo "========================================================="
        echo " MINECRAFT (1.8.8):  ${PUBLIC_ADDR}"
        [ -z "$OP_PLAYER" ] || echo " OP:                 ${OP_PLAYER}"
        [ ! -s essentials.jar ] || echo " PLUGINS:            EssentialsX"
        if [ "${{ inputs.with_panel }}" = "true" ]; then
          echo " PANEL:              http://${TUNNEL_HOST}:${PANEL_PORT}"
          echo " LOGIN:              admin@example.com / ${PANEL_PASS}"
        fi
        echo "========================================================="

    - name: Keep alive (watchdog)
      run: |
        LAST=""
        while true; do
          if [ "${{ inputs.with_panel }}" != "true" ] && ! kill -0 "$(cat paper.pid)" 2>/dev/null; then
            echo "$(date -u) Paper stopped. Last log:"; tail -n 30 server.log
            exit 1
          fi
          # pinggy/serveo reconnect and can change address: print it whenever it changes
          CUR=""
          if [ -f /tmp/pinggy.log ]; then
            CUR=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/pinggy.log | grep -oE 'tcp://[A-Za-z0-9.-]+:[0-9]{2,5}' | tail -1 | sed 's#tcp://##' || true)
          fi
          if [ -z "$CUR" ] && [ -f /tmp/serveo.log ]; then
            CUR=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/serveo.log | grep -oE 'serveo\.net:[0-9]{2,5}' | tail -1 || true)
          fi
          if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ]; then
            echo "$(date -u) CURRENT MINECRAFT ADDRESS: $CUR"
            LAST="$CUR"
          fi
          sleep 30
        done
