name: Paper 1.8.8 Server

on:
  workflow_dispatch: # Allows you to start the server manually from the Actions tab

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download Paper 1.8.8 Build 445
        run: |
          wget -O paper.jar https://fill-data.papermc.io/v1/objects/7ff6d2cec671ef0d95b3723b5c92890118fb882d73b7f8fa0a2cd31d97c55f86/paper-1.8.8-445.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > eula.txt

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Cloudflared Tunnel
        run: |
          # Start Cloudflared pointing to the IPv4 Minecraft TCP port
          cloudflared tunnel --url tcp://127.0.0.1:25565 --logfile tunnel.log &
          
          # Wait for the tunnel to generate a URL
          sleep 10
          
          echo "========================================================="
          echo "Minecraft Server is starting!"
          echo "Your TryCloudflare URL:"
          grep -oEo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log
          echo "========================================================="
          echo "HOW TO CONNECT:"
          echo "Because Cloudflare Quick Tunnels do not natively expose TCP ports,"
          echo "players cannot type the HTTPS link directly into Minecraft."
          echo "Players must install cloudflared on their PC and run:"
          echo "cloudflared access tcp --hostname <YOUR_TUNNEL_URL> --url tcp://localhost:25565"
          echo "Then, connect in Minecraft using: localhost:25565"
          echo "========================================================="

      - name: Start Paper Server
        run: java -Xms2G -Xmx2G -jar paper.jar nogui
