name: Paper 1.8.8 (bore.pub)

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Paper 1.8.8 Build 445
        run: |
          wget -O paper.jar https://fill-data.papermc.io/v1/objects/7ff6d2cec671ef0d95b3723b5c92890118fb882d73b7f8fa0a2cd31d97c55f86/paper-1.8.8-445.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > eula.txt

      - name: Install bore and create TCP tunnel
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

          ./bore local 25565 --to bore.pub > bore.log 2>&1 &
          sleep 8

          echo "----- raw bore output -----"
          cat bore.log
          echo "---------------------------"

          # Strip ANSI escape codes -> plain text
          sed 's/\x1b\[[0-9;]*m//g' bore.log > bore.clean.log

          echo "----- clean bore output -----"
          cat bore.clean.log
          echo "-----------------------------"

          # Extract port from "listening at bore.pub:58580"
          PUBLIC_PORT=$(grep -oP 'listening at bore\.pub:\K[0-9]+' bore.clean.log | head -1)

          # Fallback: parse "remote_port=58580"
          if [ -z "$PUBLIC_PORT" ]; then
            PUBLIC_PORT=$(grep -oP 'remote_port=\K[0-9]+' bore.clean.log | head -1)
          fi

          if [ -z "$PUBLIC_PORT" ]; then
            echo "ERROR: could not extract bore public port."
            exit 1
          fi

          echo "========================================================="
          echo "SERVER ADDRESS: bore.pub:$PUBLIC_PORT"
          echo "========================================================="
          echo "In Minecraft multiplayer, add a server with:"
          echo "  Server Address: bore.pub"
          echo "  Port:           $PUBLIC_PORT"
          echo "========================================================="

      - name: Start Paper Server
        run: java -Xms2G -Xmx2G -jar paper.jar nogui
