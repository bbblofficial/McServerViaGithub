name: Paper 1.8.8 Server

on:
  workflow_dispatch: # Allows you to start the server manually from the Actions tab

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download Paper 1.8.8 Build 445
        run: |
          wget -O paper.jar https://fill-data.papermc.io/v1/objects/7ff6d2cec671ef0d95b3723b5c92890118fb882d73b7f8fa0a2cd31d97c55f86/paper-1.8.8-445.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > eula.txt

      - name: Download and Start Playit.gg
        run: |
          # دانلود نسخه لینوکس Playit
          wget -O playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          
          # اجرای Playit در پس‌زمینه و ذخیره لاگ‌ها
          ./playit > playit.log 2>&1 &
          
          # صبر کردن برای ساخت لینک تایید
          sleep 10
          
          echo "========================================================="
          echo "Playit.gg is running!"
          echo "👇 CLICK THE LINK BELOW TO GET YOUR SERVER IP 👇"
          grep -o 'https://playit.gg/claim/[a-zA-Z0-9]*' playit.log
          echo "========================================================="
          echo "After clicking the link, Playit will give you an IP (like something.auto.playit.gg:12345)"
          echo "Players can put that IP directly into Minecraft to join!"
          echo "========================================================="

      - name: Start Paper Server
        run: java -Xms2G -Xmx2G -jar paper.jar nogui
