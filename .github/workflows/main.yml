name: Paper 1.8.8 Server via FRP

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Paper 1.8.8 Build 445
        run: |
          wget -O paper.jar https://fill-data.papermc.io/v1/objects/7ff6d2cec671ef0d95b3723b5c92890118fb882d73b7f8fa0a2cd31d97c55f86/paper-1.8.8-445.jar

      - name: Accept Minecraft EULA
        run: echo "eula=true" > eula.txt

      - name: Download and Configure FRP Client
        env:
          VPS_IP: ${{ vars.VPS_IP }}
          FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
        run: |
          wget -q https://github.com/fatedier/frp/releases/download/v0.58.1/frp_0.58.1_linux_amd64.tar.gz
          tar -xzf frp_0.58.1_linux_amd64.tar.gz
          mv frp_0.58.1_linux_amd64/frpc .
          chmod +x frpc

          cat > frpc.toml <<EOF
          serverAddr = "${VPS_IP}"
          serverPort = 7000
          auth.method = "token"
          auth.token = "${FRP_TOKEN}"

          [[proxies]]
          name = "minecraft-server"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 25565
          remotePort = 25565
          EOF

          ./frpc -c frpc.toml > frp.log 2>&1 &
          sleep 5

          echo "FRP log:"
          cat frp.log || true

          echo "========================================================="
          echo "Players can join using: ${VPS_IP}:25565"
          echo "========================================================="

      - name: Start Paper Server
        run: java -Xms2G -Xmx2G -jar paper.jar nogui
